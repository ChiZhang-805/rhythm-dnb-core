name: DNB core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU text runtime
        run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install "$(find dist -name '*.whl' -print -quit)[research,text,io,plots]"
      - name: Verify installed-package boundary
        run: python -c "import pathlib, rhythm_dnb; p=pathlib.Path(rhythm_dnb.__file__).resolve(); print(p); assert pathlib.Path('src').resolve() not in p.parents"
      - name: Run all tests without model downloads
        run: python -m unittest discover -s tests -q
      - name: Exercise packaged CLI
        run: python -m rhythm_dnb hardware
      - name: Scan source and configuration
        run: python tools/audit_project.py --output-dir runs/code-audit

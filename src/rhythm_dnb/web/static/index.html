<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文本评分</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header><span class="brand">文本评分</span><a class="download" href="https://github.com/ChiZhang-805/rhythm-dnb-core/releases/tag/local-web" aria-label="下载本地版" title="下载本地版"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg></a></header>
  <main>
    <section class="panel">
      <form id="score-form">
        <fieldset id="categories"><legend class="sr-only">选择标签</legend>
          <label><input type="radio" name="category" value="emotion" checked><span>情绪</span></label>
          <label><input type="radio" name="category" value="sleep"><span>睡眠</span></label>
          <label><input type="radio" name="category" value="diet"><span>饮食</span></label>
          <label><input type="radio" name="category" value="social"><span>社交</span></label>
          <label><input type="radio" name="category" value="stress"><span>压力</span></label>
        </fieldset>
        <label class="sr-only" for="text">文本输入</label>
        <textarea id="text" maxlength="500" rows="8" placeholder="请输入文本" required></textarea>
        <div class="text-meta"><span id="count">0 / 500</span></div>
        <button id="submit" class="primary" type="submit" disabled>开始分析 <span aria-hidden="true">↗</span></button>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="retry" type="button" hidden>重新连接</button>
      </form>
    </section>
    <section class="panel output-panel" aria-labelledby="result-title" aria-live="polite">
      <h1 id="result-title">分析结果</h1>
      <div id="empty" aria-label="暂无结果">—</div>
      <div id="results" hidden><div id="bars"></div></div>
    </section>
  </main>
</body>
</html>
